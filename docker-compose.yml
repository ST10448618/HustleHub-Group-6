services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-hustlehub}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    # No "ports:" on purpose - the database is reachable only by the API
    # over the internal Docker network, never from the host.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    image: hustlehub-backend
    build: ./backend
    init: true
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-hustlehub}:${MONGO_ROOT_PASSWORD}@mongo:27017/hustlehub?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      BETTERSTACK_INGESTING_HOST: ${BETTERSTACK_INGESTING_HOST:-}
      # Used only by: docker compose exec backend node src/scripts/createAdmin.js
      ADMIN_NAME: ${ADMIN_NAME:-Admin User}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeThisPassword123!}
    ports:
      - "5000:5000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # To use your own certificate instead of the built-in self-signed one:
    # volumes:
    #   - ./backend/certificates:/app/certificates:ro

  frontend:
    image: hustlehub-frontend
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://localhost:5000/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_ORIGIN: ${API_ORIGIN:-https://localhost:5000}
    ports:
      - "3000:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mongo-data: